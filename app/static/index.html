<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Archive</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:dark;--bg:#08070d;--bg2:#0d0b14;--panel:#12101a;--panel2:#171420;--line:#272232;--text:#f7f5fb;--muted:#9d97aa;--accent:#a855f7;--accent2:#7c3aed;--glow:rgba(168,85,247,.24);--good:#5ee0a0;--bad:#ff6b81;--warn:#f5c75b;--cyan:#72d8ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% -10%,rgba(124,58,237,.18),transparent 32%),radial-gradient(circle at 15% 15%,rgba(168,85,247,.08),transparent 28%),var(--bg);color:var(--text);font:14px 'DM Sans',system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 80%);opacity:.45}h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.03em;margin-top:0}h1{font-size:27px;margin-bottom:3px}h2{font-size:28px}h3{font-size:17px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 16px;border-right:1px solid var(--line);background:rgba(8,7,13,.82);backdrop-filter:blur(20px);z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:5px 10px 27px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 30px var(--glow);display:grid;place-items:center;font-weight:700}.brand span{font-family:'Space Grotesk';font-weight:700;font-size:16px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;padding:11px 12px;border-radius:10px}.nav button:hover{background:#15121d;color:var(--text)}.nav button.active{background:linear-gradient(90deg,rgba(168,85,247,.18),rgba(168,85,247,.05));border-color:rgba(168,85,247,.22);color:#e7d5ff}.nav .section{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#635d6d;margin:22px 12px 5px}.main{width:100%;max-width:1500px;margin:auto;padding:32px 42px 55px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:32px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em}.subtitle{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{min-width:280px}button,.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#17131f;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;transition:.18s ease}button:hover,.btn:hover{border-color:#493a5b;transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 7px 25px var(--glow)}button.danger{background:#351521;border-color:#54202d;color:#ffb2bf}input,select,textarea{background:#0e0c14;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.1)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.stat,.card{background:linear-gradient(145deg,rgba(23,20,32,.94),rgba(14,12,21,.94));border:1px solid var(--line);border-radius:15px}.stat{padding:19px;min-height:105px}.stat b{font-family:'Space Grotesk';font-size:27px;display:block;margin-top:8px}.card{padding:20px;margin-bottom:14px;box-shadow:0 18px 45px rgba(0,0,0,.13)}.hero{padding:28px;border-radius:19px;border:1px solid rgba(168,85,247,.2);background:radial-gradient(circle at 90% 0,rgba(168,85,247,.2),transparent 36%),linear-gradient(145deg,#17121f,#0e0c14);margin-bottom:16px}.hero h2{font-size:38px;margin:5px 0 7px}.muted,small{color:var(--muted)}table{width:100%;border-collapse:separate;border-spacing:0;background:rgba(13,11,19,.75);border:1px solid var(--line);border-radius:13px;overflow:hidden}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:left}th{color:#81798d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border:0}tr:hover td{background:rgba(168,85,247,.025)}.complete,.done,.verified{color:var(--good)}.failed{color:var(--bad)}.queued,.running,.checking,.downloading{color:var(--warn)}.hidden{display:none}.pill{padding:4px 8px;border-radius:999px;background:#211a2c;border:1px solid #342841;color:#c8b5dd;font-size:11px}.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.check label{background:#0d0b13;padding:11px;border-radius:9px;border:1px solid var(--line)}code{background:#0c0a11;border:1px solid var(--line);padding:3px 6px;border-radius:6px;color:#d9c2f3}.metric{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.accent{color:#d7b8ff}.repo-title{font-family:'Space Grotesk';font-size:15px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:5px 7px 13px}.nav{flex-direction:row;overflow:auto}.nav .section{display:none}.nav button{white-space:nowrap;width:auto}.main{padding:20px 14px 40px}.topbar{align-items:flex-start;flex-direction:column}.hero h2{font-size:29px}th:nth-child(2),td:nth-child(2){display:none}}@media(max-width:600px){.main{padding:15px 10px}.stat{min-height:90px}.stat b{font-size:22px}.toolbar input{min-width:100%;width:100%}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">G</div><span>GitHub Archive</span></div><div class="nav">
<button id="n-dashboard" onclick="page('dashboard')">⌂ &nbsp; Dashboard</button><button id="n-repos" onclick="page('repos')">◉ &nbsp; Repositories</button><button id="n-queue" onclick="page('queue')">↓ &nbsp; Download Queue</button><button id="n-browser" onclick="page('browser')">▤ &nbsp; Archive Browser</button><button id="n-storage" onclick="page('storage')">◫ &nbsp; Storage</button><button id="n-integrity" onclick="page('integrity')">✓ &nbsp; Integrity</button><div class="section">Organize</div><button id="n-groups" onclick="page('groups')">▦ &nbsp; Groups</button><div class="section">System</div><button id="n-settings" onclick="page('settings')">⚙ &nbsp; Settings</button><button id="n-api" onclick="page('api')">&lt;/&gt; &nbsp; API</button></div></aside><div class="main"><div class="topbar"><div><div class="eyebrow">Archive control center</div><h1>GitHub Archive</h1><div class="subtitle">Preserve releases, tags, source snapshots and repository history.</div></div><div class="actions"><button onclick="addRepo()">+ Add repository</button><button class="primary" onclick="checkAll()">Check all</button></div></div><section id="app"></section></div></div>
<script>
let repos=[],groups=[],state={page:'dashboard',repo:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const fmt=s=>s?new Date(s).toLocaleString():'—'; const bytes=n=>{n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'};
async function api(u,o){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||j.error||r.statusText);return j}
async function init(){repos=await api('/api/repos');groups=await api('/api/groups');page('dashboard')}
async function refresh(){repos=await api('/api/repos');groups=await api('/api/groups')}
function nav(p){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+p)?.classList.add('active')}
async function page(p){state.page=p;nav(p);await refresh(); if(p==='dashboard')return dashboard();if(p==='repos')return reposPage();if(p==='queue')return queuePage();if(p==='browser')return browserPage();if(p==='storage')return storagePage();if(p==='integrity')return integrityPage();if(p==='groups')return groupsPage();if(p==='settings')return settingsPage();if(p==='api')return apiPage()}
function dashboard(){let total=repos.reduce((a,r)=>a+Number(r.archive_size||0),0),failed=repos.reduce((a,r)=>a+Number(r.failed_files||0),0);app.innerHTML='<h2>Dashboard</h2><div class="grid"><div class="stat">Repositories<b>'+repos.length+'</b></div><div class="stat">Archived data<b>'+bytes(total)+'</b></div><div class="stat">Versions<b>'+repos.reduce((a,r)=>a+Number(r.version_count||0),0)+'</b></div><div class="stat">Failed files<b>'+failed+'</b></div></div><div class="card"><h3>What’s New?</h3><div id="activity">Loading…</div></div><div class="card"><h3>Repository health</h3>'+repoRows(repos)+'</div>' ;loadActivity()}
function repoRows(rs){return '<table><thead><tr><th>Repository</th><th>Group</th><th>Latest</th><th>Versions</th><th>Size</th><th>Status</th><th></th></tr></thead><tbody>'+rs.map(r=>'<tr><td><b>'+esc(r.name)+'</b><br><small>'+esc(r.full_name)+'</small></td><td>'+esc(r.group_name||'—')+'</td><td>'+esc(r.latest_version||'—')+'</td><td>'+r.version_count+'</td><td>'+bytes(r.archive_size)+'</td><td class="'+esc(r.status)+'">'+esc(r.status)+'</td><td><button onclick="repoPage('+r.id+')">Open</button></td></tr>').join('')+'</tbody></table>'}
async function loadActivity(){let a=await api('/api/activity');activity.innerHTML=a.length?'<table><thead><tr><th>Time</th><th>Repository</th><th>Item</th><th>Status</th></tr></thead><tbody>'+a.slice(0,30).map(x=>'<tr><td>'+fmt(x.timestamp)+'</td><td>'+esc(x.full_name)+'</td><td>'+esc(x.version||'')+'</td><td class="'+esc(x.status)+'">'+esc(x.status)+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No activity yet.</p>'}
function reposPage(){app.innerHTML='<h2>Repositories</h2><div class="toolbar"><input id="rq" placeholder="Search repositories..." oninput="filterRepos()"><button onclick="addRepo()">Add Repository</button></div><div id="rtable">'+repoRows(repos)+'</div>'}
function filterRepos(){let q=rq.value.toLowerCase();rtable.innerHTML=repoRows(repos.filter(r=>(r.full_name+' '+(r.group_name||'')).toLowerCase().includes(q)))}
async function addRepo(){let url=prompt('GitHub repository URL:');if(!url)return;try{await api('/api/repos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});await page('repos')}catch(e){alert(e.message)}}
async function checkAll(){try{await api('/api/check-all',{method:'POST'});await page(state.page)}catch(e){alert(e.message)}}
async function repoPage(id){await refresh();let r=repos.find(x=>x.id===id);let vs=await api('/api/repos/'+id+'/versions');let pol={releases:true,assets:true,source:true,current:true,tags:true,artifacts:false,commits:false,prereleases:false,...JSON.parse(r.policy||'{}')};app.innerHTML='<div class="toolbar"><button onclick="page(\'repos\')">← Repositories</button><button onclick="checkOne('+id+')">Check Now</button><button class="danger" onclick="delRepo('+id+')">Delete</button></div><div class="card"><h2>'+esc(r.full_name)+'</h2><p class="muted">'+esc(r.url)+' · branch: '+esc(r.default_branch||'—')+'</p><div class="grid"><div class="stat">Latest<b>'+esc(r.latest_version||'—')+'</b></div><div class="stat">Versions<b>'+r.version_count+'</b></div><div class="stat">Archive size<b>'+bytes(r.archive_size)+'</b></div><div class="stat">Status<b class="'+esc(r.status)+'">'+esc(r.status)+'</b></div></div></div><div class="card"><h3>Archive policy</h3><div class="toolbar"><label>Detection mode <select id="pmode"><option value="release_fallback" '+((pol.mode||'release_fallback')==='release_fallback'?'selected':'')+'>Release + tag fallback</option><option value="tags_only" '+(pol.mode==='tags_only'?'selected':'')+'>Tags only</option><option value="both" '+(pol.mode==='both'?'selected':'')+'>Both releases and tags</option></select></label></div><div class="check">'+Object.entries({releases:'Releases',assets:'Release assets',source:'Exact source',current:'Current source',tags:'Tags',artifacts:'Actions artifacts',commits:'Commit snapshots',prereleases:'Prereleases'}).map(([k,v])=>'<label><input type="checkbox" id="p-'+k+'" '+(pol[k]?'checked':'')+'> '+v+'</label>').join('')+'</div><br><button class="primary" onclick="savePolicy('+id+')">Save Policy</button></div><div class="card"><h3>Version history</h3>'+(vs.length?vs.map(v=>'<div class="card"><div class="actions" style="justify-content:space-between"><div><b>'+esc(v.version)+'</b> <span class="pill">'+esc(v.kind)+'</span><br><small>'+fmt(v.published_at)+'</small></div><span class="'+esc(v.status)+'">'+esc(v.status)+'</span><button onclick="versionPage('+v.id+')">Files</button></div></div>').join(''):'<p class="muted">No versions yet.</p>')+'</div>'}
async function savePolicy(id){let keys=['releases','assets','source','current','tags','artifacts','commits','prereleases'],p={mode:document.getElementById('pmode').value};keys.forEach(k=>p[k]=document.getElementById('p-'+k).checked);try{await api('/api/repos/'+id+'/policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({policy:p})});alert('Policy saved')}catch(e){alert(e.message)}}
async function checkOne(id){try{await api('/api/repos/'+id+'/check',{method:'POST'});await repoPage(id)}catch(e){alert(e.message)}}
async function delRepo(id){if(!confirm('Delete repository and its database record? Files on disk are NOT automatically deleted.'))return;await api('/api/repos/'+id,{method:'DELETE'});page('repos')}
async function versionPage(id){let d=await api('/api/versions/'+id),v=d.version;app.innerHTML='<div class="toolbar"><button onclick="repoPage('+v.repo_id+')">← Versions</button></div><div class="card"><h2>'+esc(v.repo_name)+' — '+esc(v.version)+'</h2><p><span class="'+esc(v.status)+'">'+esc(v.status)+'</span> · '+esc(v.kind)+' · '+fmt(v.published_at)+'</p><p class="muted">SHA: '+esc(v.target_sha||'not resolved by release API')+'</p></div><div class="card"><h3>Archived files</h3><table><thead><tr><th>Type</th><th>File</th><th>Size</th><th>Status</th><th>Verification</th><th></th></tr></thead><tbody>'+d.files.map(f=>'<tr><td>'+esc(f.category)+'</td><td>'+esc(f.name)+'</td><td>'+bytes(f.size||f.expected_size)+'</td><td class="'+esc(f.status)+'">'+esc(f.status)+(f.error?'<br><small>'+esc(f.error)+'</small>':'')+'</td><td class="'+esc(f.verify_status||'')+'">'+esc(f.verify_status||'unverified')+'</td><td>'+(f.status==='complete'?'<a class="btn" href="/download/'+f.id+'">Download</a>':'')+'</td></tr>').join('')+'</tbody></table></div>'}
async function queuePage(){let q=await api('/api/queue');app.innerHTML='<h2>Download Queue</h2><div class="card"><p class="muted">Downloads run with a persistent queue and '+((await api('/api/settings')).workers)+' worker(s). Interrupted .part files resume automatically.</p></div><table><thead><tr><th>Time</th><th>Repository</th><th>Version</th><th>File</th><th>Status</th><th>Attempts</th><th></th></tr></thead><tbody>'+q.map(x=>'<tr><td>'+fmt(x.queued_at)+'</td><td>'+esc(x.full_name)+'</td><td>'+esc(x.version)+'</td><td>'+esc(x.name)+'</td><td class="'+esc(x.status)+'">'+esc(x.status)+'</td><td>'+x.attempts+'</td><td>'+(x.status==='failed'?'<button onclick="retry('+x.id+')">Retry</button>':'')+'</td></tr>').join('')+'</tbody></table>'}
async function retry(id){await api('/api/queue/'+id+'/retry',{method:'POST'});queuePage()}
async function browserPage(){app.innerHTML='<h2>Archive Browser</h2><div class="card"><p class="muted">Browse the archive from the web UI. The database-backed file list is used for direct downloads.</p></div>'+repoRows(repos)}
async function storagePage(){let s=await api('/api/storage'),rs=await api('/api/storage/repos');app.innerHTML='<h2>Storage</h2><div class="grid"><div class="stat">Total capacity<b>'+bytes(s.total_bytes)+'</b></div><div class="stat">Free<b>'+bytes(s.free_bytes)+'</b></div><div class="stat">Archive<b>'+bytes(s.archive_bytes)+'</b></div><div class="stat">Files<b>'+s.files+'</b></div></div><div class="card"><h3>Largest repositories</h3><table><thead><tr><th>Repository</th><th>Versions</th><th>Size</th></tr></thead><tbody>'+rs.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+x.versions+'</td><td>'+bytes(x.size)+'</td></tr>').join('')+'</tbody></table></div>'}
async function integrityPage(){app.innerHTML='<h2>Integrity Verification</h2><div class="card"><p>Recalculate SHA-256 for every completed archive file and compare it with GitHub's digest when one is available.</p><button class="primary" onclick="verify()">Verify Everything</button><div id="vr"></div></div>'}
async function verify(){vr.innerHTML='Checking…';let r=await api('/api/verify');vr.innerHTML='<h3>Result</h3><p class="complete">Verified: '+r.ok+'</p><p class="'+(r.failed?'failed':'complete')+'">Failed: '+r.failed+'</p>'}
async function groupsPage(){app.innerHTML='<h2>Repository Groups</h2><div class="toolbar"><input id="gn" placeholder="New group name"><button onclick="addGroup()">Create Group</button></div><div class="grid">'+groups.map(g=>'<div class="card"><h3>'+esc(g.name)+'</h3><p class="muted">'+g.repo_count+' repositories</p><button class="danger" onclick="delGroup('+g.id+')">Delete</button></div>').join('')+'</div><div class="card"><h3>Assign repositories</h3>'+repos.map(r=>'<div class="toolbar"><b style="min-width:260px">'+esc(r.full_name)+'</b><select onchange="setGroup('+r.id+',this.value)"><option value="">No group</option>'+groups.map(g=>'<option value="'+g.id+'" '+(String(g.id)===String(r.group_id)?'selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></div>').join('')+'</div>'}
async function addGroup(){if(!gn.value.trim())return;await api('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:gn.value})});page('groups')}
async function delGroup(id){await api('/api/groups/'+id,{method:'DELETE'});page('groups')}
async function setGroup(rid,gid){if(gid)await api('/api/repos/'+rid+'/group/'+gid,{method:'PUT'});else await api('/api/repos/'+rid+'/group',{method:'DELETE'});await refresh()}
async function settingsPage(){let s=await api('/api/settings');app.innerHTML='<h2>Settings</h2><div class="card"><h3>Scheduler</h3><p>Check interval is stored in the archive database and can be changed without rebuilding the container.</p><div class="toolbar"><label>Minutes <input id="interval" type="number" min="1" value="'+s.check_interval_minutes+'"></label><label><input id="pre" type="checkbox" '+(s.include_prereleases?'checked':'')+'> Include prereleases by default</label></div><button class="primary" onclick="saveSettings()">Save Settings</button></div><div class="card"><h3>Connection</h3><p>GitHub token: <b>'+ (s.token_configured?'configured':'not configured')+'</b></p><p>Webhook secret: <b>'+ (s.webhook_configured?'configured':'not configured')+'</b></p><p>Workers: <b>'+s.workers+'</b> (set with DOWNLOAD_WORKERS)</p></div><div class="card"><h3>Webhook</h3><p>Configure a GitHub repository webhook to POST release/tag events to <code>/api/webhook</code>. Set <code>WEBHOOK_SECRET</code> in TrueNAS for signature verification.</p></div>}
async function saveSettings(){await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({check_interval_minutes:Number(interval.value),include_prereleases:pre.checked})});alert('Saved')}
function apiPage(){app.innerHTML='<h2>REST API</h2><div class="card"><p>The app exposes JSON endpoints for repositories, checks, versions, queue, storage, integrity, groups, search, archive browsing and settings.</p><p><code>GET /api/repos</code></p><p><code>POST /api/check-all</code></p><p><code>GET /api/queue</code></p><p><code>GET /api/storage</code></p><p><code>GET /api/search?q=...</code></p><p><code>GET /api/activity</code></p><p><code>POST /api/webhook</code></p></div>'}
init()
</script></body></html></body></html>
