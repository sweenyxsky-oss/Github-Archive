<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub Archive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #08070d;
      --bg2: #0d0b14;
      --panel: #12101a;
      --panel2: #171420;
      --line: #272232;
      --text: #f7f5fb;
      --muted: #9d97aa;
      --accent: #a855f7;
      --accent2: #7c3aed;
      --glow: rgba(168, 85, 247, 0.24);
      --complete: #10b981;
      --failed: #ef4444;
      --pending: #f59e0b;
      --queued: #3b82f6;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 78% -10%, rgba(124,58,237,.18), transparent 32%), radial-gradient(circle at 15% 50%, rgba(168,85,247,.12), transparent 40%);
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.5;
      pointer-events: auto;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    button,
    input,
    select,
    textarea,
    label,
    .btn,
    [data-click],
    [data-change],
    [data-input] {
      pointer-events: auto !important;
    }

    button {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover { background: var(--panel); border-color: var(--accent); }
    button:active { background: var(--accent); color: var(--bg); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    button.primary:hover {
      background: var(--accent2);
      border-color: var(--accent2);
    }
    button[disabled] {
      cursor: not-allowed;
      opacity: 0.5;
      pointer-events: none !important;
    }

    input, select, textarea {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--glow);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(8,7,13,0.8);
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }
    .nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      pointer-events: auto;
    }

    #app {
      pointer-events: auto;
    }

    .card,
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin: 16px 0;
      pointer-events: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }

    .stat b { font-size: 24px; color: var(--accent); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 16px 0;
      pointer-events: auto;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
      z-index: 100;
      pointer-events: auto;
    }
    .modal {
      width: min(560px, calc(100vw - 28px));
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.5);
      pointer-events: auto;
      z-index: 101;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      pointer-events: auto;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      pointer-events: auto;
    }
    th {
      background: var(--panel2);
      position: sticky;
      top: 0;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.complete { background: rgba(16,185,129,.2); color: #10b981; }
    .status.failed { background: rgba(239,68,68,.2); color: #ef4444; }
    .status.pending, .status.downloading { background: rgba(245,158,11,.2); color: #f59e0b; }
    .status.queued { background: rgba(59,130,246,.2); color: #3b82f6; }
    .status.never, .status.checking, .status.importing { background: rgba(107,114,128,.2); color: #9ca3af; }

    .muted { color: var(--muted); }
    .error { color: var(--failed); font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    .btn {
      display: inline-block;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--bg);
      border-radius: 4px;
      padding: 6px 12px;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent2); border-color: var(--accent2); text-decoration: none; }
  </style>
</head>
<body>
  <div class="nav">
    <button id="n-dashboard" data-click="page('dashboard')">⌂ &nbsp; Dashboard</button>
    <button id="n-repos" data-click="page('repos')">◉ &nbsp; Repositories</button>
    <button id="n-queue" data-click="page('queue')">⟳ &nbsp; Queue</button>
    <button id="n-browser" data-click="page('browser')">📁 &nbsp; Browser</button>
    <button id="n-storage" data-click="page('storage')">💾 &nbsp; Storage</button>
    <button id="n-integrity" data-click="page('integrity')">✓ &nbsp; Integrity</button>
    <button id="n-groups" data-click="page('groups')">👥 &nbsp; Groups</button>
    <button id="n-settings" data-click="page('settings')">⚙ &nbsp; Settings</button>
    <button id="n-api" data-click="page('api')">∑ &nbsp; API</button>
  </div>

  <div class="container">
    <div id="app"><p class="muted">Loading…</p></div>
    <div id="activity" style="display:none"></div>
  </div>

  <script src="/static/app.js?v=20261005-pagination-fix" defer></script>
</body>
</html>
